<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11151c">
  <title>Calculator</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #11151c;
      color: #f4f6fb;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(ellipse at 50% 0%, #202c3d 0, #11151c 58%);
    }
    .calculator {
      width: min(100%, 360px);
      padding: 25px;
      border: 1px solid #313b4b;
      border-radius: 27px;
      background: linear-gradient(145deg, #1d2531, #171d27);
      box-shadow: 0 28px 80px #0008, inset 0 1px #ffffff0b;
    }
    .topline { display: flex; align-items: center; justify-content: space-between; margin-bottom: 27px; }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: #cbd3df; }
    .brand-mark { display: grid; width: 28px; height: 28px; place-items: center; border-radius: 9px; color: #a9e9d3; background: #293d3a; font-size: 17px; }
    .keyboard-hint { color: #798596; font-size: 11px; }
    .display { min-height: 112px; display: flex; flex-direction: column; align-items: flex-end; justify-content: flex-end; gap: 8px; overflow: hidden; padding: 4px 2px 20px; text-align: right; }
    .expression { min-height: 20px; max-width: 100%; overflow: hidden; color: #91a0b3; font-size: 14px; text-overflow: ellipsis; white-space: nowrap; }
    .value { width: 100%; overflow: hidden; color: #f4f6fb; font-size: clamp(38px, 12vw, 54px); font-weight: 350; letter-spacing: -.055em; line-height: 1.1; text-overflow: ellipsis; white-space: nowrap; }
    .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 11px; }
    button { min-width: 0; height: 59px; border: 1px solid #354050; border-radius: 17px; background: #242d39; color: #e9edf4; font: inherit; font-size: 19px; font-weight: 550; cursor: pointer; transition: transform .12s ease, background .12s ease, border-color .12s ease; -webkit-tap-highlight-color: transparent; }
    button:hover { background: #303b49; border-color: #48576a; }
    button:active { transform: scale(.96); }
    button:focus-visible { outline: 2px solid #94e4ca; outline-offset: 2px; }
    .utility { background: #303a47; color: #aeb9c8; }
    .operator { background: #2a3542; color: #a4e6ce; font-size: 22px; }
    .operator[aria-pressed="true"] { background: #345449; border-color: #568a75; }
    .equals { border-color: #a1e4ce; background: #a1e4ce; color: #17231e; font-size: 23px; }
    .equals:hover { border-color: #b8f1df; background: #b8f1df; }
    .zero { grid-column: span 2; }
    @media (max-width: 400px) { body { padding: 14px; } .calculator { padding: 21px; } .keys { gap: 9px; } button { height: 56px; border-radius: 15px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <header class="topline">
      <div class="brand"><span class="brand-mark" aria-hidden="true">÷</span> Calculator</div>
      <span class="keyboard-hint">KEYBOARD READY</span>
    </header>
    <section class="display" aria-live="polite" aria-atomic="true">
      <div class="expression" id="expression"></div>
      <output class="value" id="display">0</output>
    </section>
    <div class="keys" aria-label="Calculator keys">
      <button class="utility" data-action="clear" aria-label="Clear">AC</button>
      <button class="utility" data-action="sign" aria-label="Change sign">+/−</button>
      <button class="utility" data-action="percent" aria-label="Percent">%</button>
      <button class="operator" data-operation="divide" aria-label="Divide">÷</button>
      <button data-digit="7">7</button><button data-digit="8">8</button><button data-digit="9">9</button>
      <button class="operator" data-operation="multiply" aria-label="Multiply">×</button>
      <button data-digit="4">4</button><button data-digit="5">5</button><button data-digit="6">6</button>
      <button class="operator" data-operation="subtract" aria-label="Subtract">−</button>
      <button data-digit="1">1</button><button data-digit="2">2</button><button data-digit="3">3</button>
      <button class="operator" data-operation="add" aria-label="Add">+</button>
      <button class="utility zero" data-digit="0">0</button><button data-action="decimal" aria-label="Decimal point">.</button>
      <button class="equals" data-action="equals" aria-label="Equals">=</button>
    </div>
  </main>
  <script>
    (() => {
      const display = document.querySelector('#display');
      const expression = document.querySelector('#expression');
      const keys = document.querySelector('.keys');
      let current = '0';
      let stored = null;
      let operation = null;
      let replaceNext = false;
      let justCalculated = false;

      const symbols = { add: '+', subtract: '−', multiply: '×', divide: '÷' };
      const pretty = number => {
        if (!Number.isFinite(number)) return 'Error';
        const rounded = Number.parseFloat(number.toPrecision(12));
        return String(rounded);
      };
      const update = () => {
        display.textContent = current;
        document.querySelectorAll('[data-operation]').forEach(button => {
          button.setAttribute('aria-pressed', String(button.dataset.operation === operation));
        });
      };
      const enterDigit = digit => {
        if (current === 'Error' || replaceNext || justCalculated) {
          current = digit;
          replaceNext = false;
          justCalculated = false;
        } else if (current === '0') current = digit;
        else if (current.replace('-', '').length < 14) current += digit;
        update();
      };
      const chooseOperation = next => {
        if (current === 'Error') return;
        if (operation && !replaceNext) calculate();
        stored = Number(current);
        operation = next;
        replaceNext = true;
        justCalculated = false;
        expression.textContent = `${pretty(stored)} ${symbols[operation]}`;
        update();
      };
      const calculate = () => {
        if (operation === null || stored === null || current === 'Error') return;
        const left = stored;
        const right = Number(current);
        let result;
        if (operation === 'add') result = left + right;
        if (operation === 'subtract') result = left - right;
        if (operation === 'multiply') result = left * right;
        if (operation === 'divide') result = right === 0 ? NaN : left / right;
        expression.textContent = `${pretty(left)} ${symbols[operation]} ${pretty(right)} =`;
        current = pretty(result);
        stored = null;
        operation = null;
        replaceNext = true;
        justCalculated = true;
        update();
      };
      const act = action => {
        if (action === 'clear') {
          current = '0'; stored = null; operation = null; replaceNext = false; justCalculated = false;
          expression.textContent = '';
        }
        if (action === 'decimal' && current !== 'Error') {
          if (replaceNext || justCalculated) { current = '0'; replaceNext = false; justCalculated = false; }
          if (!current.includes('.')) current += '.';
        }
        if (action === 'sign' && current !== 'Error' && Number(current) !== 0) current = current.startsWith('-') ? current.slice(1) : `-${current}`;
        if (action === 'percent' && current !== 'Error') current = pretty(Number(current) / 100);
        if (action === 'equals') calculate();
        update();
      };
      keys.addEventListener('click', event => {
        const button = event.target.closest('button');
        if (!button) return;
        if (button.dataset.digit !== undefined) enterDigit(button.dataset.digit);
        else if (button.dataset.operation) chooseOperation(button.dataset.operation);
        else act(button.dataset.action);
      });
      document.addEventListener('keydown', event => {
        if (/^[0-9]$/.test(event.key)) enterDigit(event.key);
        else if (event.key === '.') act('decimal');
        else if (event.key === 'Backspace') {
          event.preventDefault();
          if (!replaceNext && current !== 'Error') current = current.length > 1 ? current.slice(0, -1) : '0';
          update();
        } else if (event.key === 'Escape' || event.key.toLowerCase() === 'c') act('clear');
        else if (event.key === 'Enter' || event.key === '=') { event.preventDefault(); calculate(); }
        else if (event.key === '+') chooseOperation('add');
        else if (event.key === '-') chooseOperation('subtract');
        else if (event.key === '*') chooseOperation('multiply');
        else if (event.key === '/') { event.preventDefault(); chooseOperation('divide'); }
        else if (event.key === '%') act('percent');
        else if (event.key === 'F9') act('sign');
      });
      update();
    })();
  </script>
</body>
</html>
