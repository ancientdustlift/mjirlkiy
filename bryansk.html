  flatPoly([-HX * 10, -HZ * 10, HX * 10, -HZ * 10, HX * 10, HZ * 10, -HX * 10, HZ * 10], 0, hex('#cfc8b6'));
  const groundEnd = V.length / 9;

  for (const g of DATA.g) flatPoly(g, 0, hex('#9bb97a'));
  for (const w of DATA.w) flatPoly(w, 0, hex('#5f93bd'));
  const LINE = [hex('#f1ecdf'), hex('#5f93bd'), hex('#6d6a66')];
  for (const order of [1, 0, 2]) for (const l of DATA.r) {
    if (l[0] !== order) continue;
    const hw = l[1] / 20, col = LINE[l[0]];
    for (let i = 2; i + 3 < l.length; i += 2) {
      const ax = l[i] / 10, az = l[i + 1] / 10, bx = l[i + 2] / 10, bz = l[i + 3] / 10;
      const len = Math.hypot(bx - ax, bz - az) || 1, px = -(bz - az) / len * hw, pz = (bx - ax) / len * hw;
      // Extend each segment by its half-width so joints between segments leave no notch.
      const ex = (bx - ax) / len * hw * .6, ez = (bz - az) / len * hw * .6;
      quad([ax - ex + px, 0, az - ez + pz], [ax - ex - px, 0, az - ez - pz], [bx + ex - px, 0, bz + ez - pz], [bx + ex + px, 0, bz + ez + pz], UP, col, col);
    }
  }
  const overlayEnd = V.length / 9;

  const side = hex('#3a3f4c');
  [[-HX, -HZ, HX, -HZ, [0, 0, -1]], [HX, -HZ, HX, HZ, [1, 0, 0]], [HX, HZ, -HX, HZ, [0, 0, 1]], [-HX, HZ, -HX, -HZ, [-1, 0, 0]]]
    .forEach(([ax, az, bx, bz, n]) => quad([ax, -SLAB, az], [bx, -SLAB, bz], [bx, 0, bz], [ax, 0, az], n, mul(side, .55), side));

  function dome(cx, cz, y, r) {
    // Drum, then an onion profile (radius factor, height factor) swept around the axis.
    const prof = [[.78, 0], [.78, .9], [1.05, 1.15], [1.12, 1.55], [.85, 2.05], [.36, 2.5], [.06, 2.95]], seg = 10;
    for (let i = 0; i < prof.length - 1; i++) for (let s = 0; s < seg; s++) {
      const a0 = s / seg * 6.2832, a1 = (s + 1) / seg * 6.2832, [r0, h0] = prof[i], [r1, h1] = prof[i + 1];
      const p = (rr, hh, a) => [cx + Math.cos(a) * rr * r, y + hh * r, cz + Math.sin(a) * rr * r];
      const am = (a0 + a1) / 2, slope = (r0 - r1) / (h1 - h0 || 1e-3), nl = Math.hypot(1, slope);
      const n = [Math.cos(am) / nl, slope / nl, Math.sin(am) / nl];
      const col = i === 0 ? hex('#f4f0e6') : GOLD;
      quad(p(r0, h0, a0), p(r0, h0, a1), p(r1, h1, a1), p(r1, h1, a0), n, col, col);
    }
  }

  DATA.b.forEach((b, bi) => {
    const h = b[0] / 10, kind = b[1], r = b.slice(2), n = r.length / 2;
    const tint = 0.94 + ((bi * 2654435761 >>> 0) % 100) / 800;
    const wall = mul(kind ? KIND[kind][0] : WALLS[(bi * 7) % WALLS.length], tint);
    const roof = mul(kind ? KIND[kind][1] : ROOFS[(bi * 13) % ROOFS.length], tint);
    const sign = area(r) > 0 ? 1 : -1, base = mul(wall, .68);
    let cx = 0, cz = 0;
    for (let i = 0; i < n; i++) {
      const j = (i + 1) % n, ax = r[2 * i] / 10, az = r[2 * i + 1] / 10, bx = r[2 * j] / 10, bz = r[2 * j + 1] / 10;
      const len = Math.hypot(bx - ax, bz - az) || 1;
      quad([ax, 0, az], [bx, 0, bz], [bx, h, bz], [ax, h, az], [(bz - az) / len * sign, 0, -(bx - ax) / len * sign], base, wall);
      cx += ax / n; cz += az / n;
    }
    flatPoly(r, h, roof);
    // Decorative: churches get a gilded dome sized from their footprint (not surveyed geometry).
    if (kind === 1) dome(cx, cz, h, Math.max(2.2, Math.min(7, Math.sqrt(Math.abs(area(r)) / 100) * 0.2)));
  });
  const total = V.length / 9;

  // ---------- GL ----------
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, `
    attribute vec3 p, n, c; uniform mat4 m; varying vec3 vc; varying float vd;
    void main() {
      float d = max(dot(n, normalize(vec3(-0.5, 0.78, 0.42))), 0.0);
      float sky = 0.5 + 0.5 * n.y;
      // Warm sun, cool fill from the sky.
      vc = c * (vec3(1.0, 0.95, 0.86) * d * 0.62 + mix(vec3(0.50, 0.50, 0.55), vec3(0.56, 0.58, 0.64), sky));
      gl_Position = m * vec4(p, 1.0); vd = gl_Position.w;
    }`));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, `
    precision mediump float; varying vec3 vc; varying float vd;
    void main() { float f = clamp((vd - 2500.0) / 9000.0, 0.0, 0.45); gl_FragColor = vec4(mix(vc, vec3(0.30, 0.36, 0.48), f), 1.0); }`));
  gl.linkProgram(prog); gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(V), gl.STATIC_DRAW);
  ['p', 'n', 'c'].forEach((name, i) => { const loc = gl.getAttribLocation(prog, name); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 3, gl.FLOAT, false, 36, i * 12); });
  const uM = gl.getUniformLocation(prog, 'm');
  V.length = 0;

  // ---------- camera ----------
  let yaw = -0.62, pitch = 0.66, dist = 5300, tx = 0, tz = 0, idle = -1e9, drag = null, W = 1, H = 1;
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; gl.viewport(0, 0, cv.width, cv.height);
  }
  addEventListener('resize', resize); resize();
  cv.addEventListener('contextmenu', e => e.preventDefault());
  cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, pan: e.button === 2 || e.shiftKey }; cv.setPointerCapture(e.pointerId); cv.classList.add('drag'); });
  cv.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY;
    if (drag.pan) {
      const k = dist * 0.0011;
      tx += (-Math.cos(yaw) * dx - Math.sin(yaw) * dy) * k; tz += (Math.sin(yaw) * dx - Math.cos(yaw) * dy) * k;
      tx = Math.max(-HX, Math.min(HX, tx)); tz = Math.max(-HZ, Math.min(HZ, tz));
    } else { yaw -= dx * 0.005; pitch = Math.max(0.12, Math.min(1.5, pitch + dy * 0.004)); }
  });
  const end = () => { drag = null; idle = performance.now(); cv.classList.remove('drag'); };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
  cv.addEventListener('wheel', e => { e.preventDefault(); dist = Math.max(220, Math.min(9000, dist * Math.exp(e.deltaY * 0.0011))); idle = performance.now(); }, { passive: false });

  function matrix() {
    const eye = [tx + dist * Math.cos(pitch) * Math.sin(yaw), dist * Math.sin(pitch), tz + dist * Math.cos(pitch) * Math.cos(yaw)];
    const f = [tx - eye[0], -eye[1], tz - eye[2]], fl = Math.hypot(...f); f[0] /= fl; f[1] /= fl; f[2] /= fl;
    const s = [-f[2], 0, f[0]], sl = Math.hypot(s[0], s[2]); s[0] /= sl; s[2] /= sl;       // f × up
    const u = [s[1] * f[2] - s[2] * f[1], s[2] * f[0] - s[0] * f[2], s[0] * f[1] - s[1] * f[0]];
    const near = Math.max(8, dist * 0.02), far = dist + 12000, t = 1 / Math.tan(0.34), a = W / H;
    const view = [s[0], u[0], -f[0], 0, s[1], u[1], -f[1], 0, s[2], u[2], -f[2], 0,
      -(s[0] * eye[0] + s[1] * eye[1] + s[2] * eye[2]), -(u[0] * eye[0] + u[1] * eye[1] + u[2] * eye[2]), f[0] * eye[0] + f[1] * eye[1] + f[2] * eye[2], 1];
    const pr = [t / a, 0, 0, 0, 0, t, 0, 0, 0, 0, (far + near) / (near - far), -1, 0, 0, 2 * far * near / (near - far), 0];
    const m = new Float32Array(16);
    for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) m[c * 4 + r] = pr[r] * view[c * 4] + pr[4 + r] * view[c * 4 + 1] + pr[8 + r] * view[c * 4 + 2] + pr[12 + r] * view[c * 4 + 3];
    return m;
  }

  // ---------- labels ----------
  const holder = document.getElementById('labels');
  const labels = DATA.labels.map(([name, x, z, water]) => {
    const el = document.createElement('div'); el.className = 'lb' + (water ? ' water' : ''); el.textContent = name; holder.appendChild(el);
    return { el, x: x / 10, z: z / 10, y: water ? 0 : 6 };
  });
  labels.forEach(l => { l.w = l.el.offsetWidth + 8; });
  function placeLabels(m) {
    const taken = [];
    for (const l of labels) {
      const w = m[3] * l.x + m[7] * l.y + m[11] * l.z + m[15];
      const sx = ((m[0] * l.x + m[4] * l.y + m[8] * l.z + m[12]) / w * .5 + .5) * W;
      const sy = (1 - ((m[1] * l.x + m[5] * l.y + m[9] * l.z + m[13]) / w * .5 + .5)) * H;
      const pin = Math.max(14, Math.min(60, 62000 / w));
      let show = w > 0 && w < 9000 && sx > 0 && sx < W && sy > 0 && sy < H;
      // Earlier labels win: hide one that would overlap a label already placed this frame.
      const top = sy - pin - 26;
      if (show && taken.some(t => Math.abs(t[0] - sx) < (t[2] + l.w) / 2 && Math.abs(t[1] - top) < 26)) show = false;
      if (show) taken.push([sx, top, l.w]);
      l.el.style.display = show ? '' : 'none';
      if (show) { l.el.style.setProperty('--pin', pin + 'px'); l.el.style.transform = `translate(${sx}px, ${sy - pin}px) translate(-50%, -100%)`; }
    }
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    if (!still && !drag && now - idle > 2500) yaw += dt * 0.045;
    const m = matrix();
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.uniformMatrix4fv(uM, false, m);
    gl.enable(gl.DEPTH_TEST); gl.drawArrays(gl.TRIANGLES, 0, groundEnd);
    // Flat overlays share the ground plane, so they are drawn in order with no depth test.
    gl.disable(gl.DEPTH_TEST); gl.drawArrays(gl.TRIANGLES, groundEnd, overlayEnd - groundEnd);
    gl.enable(gl.DEPTH_TEST); gl.drawArrays(gl.TRIANGLES, overlayEnd, total - overlayEnd);
    placeLabels(m);
    requestAnimationFrame(frame);
  }
  window.__stats = { vertices: total, buildings: DATA.b.length };
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
